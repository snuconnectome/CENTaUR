# Training Configuration for EXAONE 4.0-32B
# Model: LGAI-EXAONE/EXAONE-4.0-32B-Instruct
# Method: DeepSpeed ZeRO-3 with CPU offloading

model:
  name: "LGAI-EXAONE/EXAONE-4.0-32B-Instruct"
  revision: "main"
  trust_remote_code: true

training:
  # Batch size per GPU
  per_device_train_batch_size: 1
  per_device_eval_batch_size: 1

  # Gradient accumulation for effective batch size
  gradient_accumulation_steps: 4
  # Effective batch size = 1 * 4 * 7 GPUs = 28

  # Learning rate (lower for larger model)
  learning_rate: 2.0e-5
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.05

  # Training duration
  num_train_epochs: 3
  max_steps: -1  # -1 means use num_train_epochs

  # Optimization
  optim: "adamw_torch"
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0

  # Precision
  fp16: false
  bf16: true  # EXAONE 4.0 supports bfloat16

  # Memory optimization
  gradient_checkpointing: true
  gradient_checkpointing_kwargs:
    use_reentrant: false

  # Logging and checkpointing
  logging_steps: 10
  save_strategy: "steps"
  save_steps: 500
  save_total_limit: 3
  evaluation_strategy: "steps"
  eval_steps: 500

  # DeepSpeed
  deepspeed: "configs/deepspeed_zero3_32b.json"

data:
  # Dataset
  train_file: "data/choices13k_1000.jsonl"
  validation_split: 0.1

  # Sequence length
  max_seq_length: 512

  # Data collation
  dataloader_num_workers: 4
  dataloader_pin_memory: true

output:
  output_dir: "models/ko-centaur-exaone40"
  overwrite_output_dir: false

  # Checkpointing
  save_safetensors: true
  resume_from_checkpoint: null

misc:
  # Reproducibility
  seed: 42
  data_seed: 42

  # Reporting
  report_to: ["tensorboard"]
  run_name: "ko-centaur-exaone40"

  # Device
  local_rank: -1
  ddp_find_unused_parameters: false
